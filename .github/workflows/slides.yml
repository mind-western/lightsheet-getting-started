# Build slides.md into HTML and PDF slides with Marp CLI and publish them to
# GitHub Pages (Settings → Pages → Source: "GitHub Actions").
# The HTML deck is served at the Pages root, the PDF at /slides.pdf.
# Adapted from khanlab/SPIMquant-intro.

name: Build and deploy slides

on:
  push:
    branches: [main]
    paths:
      - 'slides.md'
      - 'figures/**'
      - '.github/workflows/slides.yml'
  pull_request:
    branches: [main]
    paths:
      - 'slides.md'
      - 'figures/**'
      - '.github/workflows/slides.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build HTML slides
        run: |
          mkdir -p _site
          npx -y @marp-team/marp-cli@4 --html --allow-local-files slides.md -o _site/index.html

      - name: Build PDF slides
        run: |
          npx -y @marp-team/marp-cli@4 --allow-local-files slides.md -o _site/slides.pdf

      - name: Copy figures
        run: |
          if [ -d figures ]; then cp -r figures _site/; fi

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: _site/slides.pdf
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
